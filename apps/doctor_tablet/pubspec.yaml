name: doctor_tablet
description: "Doctor tablet workspace: handwriting notebook and clinical workflows."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  clinic_core:
    path: ../../packages/clinic_core

  # Networking and state management for the tablet app.
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Generates localized Dart classes from lib/l10n/*.arb (see l10n.yaml).
  generate: true
